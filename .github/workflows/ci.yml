name: CI

on:
  push:
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-chess==1.999
      - run: python -m unittest discover -s tests -v
      - run: python research.py template validate
      - name: RL benchmark smoke run
        run: NRL_SEED=101 NRL_BUDGET='{"rollouts":800,"eval_problems":128}' python benchmark/rl_eval.py
